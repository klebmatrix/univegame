<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* CSS ULTRA SIMPLES PARA NÃO TRAVAR */
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: Arial, sans-serif; }
        
        /* BOTÃO DE SAÍDA - AGORA EM NOVA ABA PARA NÃO SER BLOQUEADO */
        #btn-home {
            position: fixed; 
            top: 50px; 
            left: 20px; 
            z-index: 9999;
            background: #ff4757; 
            color: #fff !important; 
            padding: 15px 20px; 
            text-decoration: none; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #fff;
            display: block;
        }

        #score {
            position: absolute; top: 120px; width: 100%; text-align: center;
            font-size: 80px; color: #ffd700; font-weight: bold; pointer-events: none;
        }
        canvas { display: block; background: #000; }
    </style>
</head>
<body>

    <a href="https://cromosvirtual.com/" id="btn-home" target="_blank">Home</a>
    
    <div id="score">0</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // Ajuste de tela
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let player = { x: window.innerWidth/2, y: window.innerHeight * 0.7, r: 30 };
        let atoms = [];

        // Função de movimento simples
        function move(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = x;
        }

        window.addEventListener('touchmove', (e) => {
            // Se tocar no botão de sair, não interfere
            if(e.target.id === 'btn-home') return;
            e.preventDefault();
            move(e);
        }, { passive: false });

        window.addEventListener('mousemove', move);

        function spawn() {
            atoms.push({
                x: Math.random() * canvas.width,
                y: -30,
                s: 5
            });
        }

        function loop() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha Jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();

            // Desenha Átomos
            for (let i = atoms.length - 1; i >= 0; i--) {
                let a = atoms[i];
                a.y += a.s;
                
                ctx.beginPath();
                ctx.arc(a.x, a.y, 15, 0, Math.PI*2);
                ctx.fillStyle = "#ffd700";
                ctx.fill();

                // Colisão simples
                let dist = Math.sqrt((player.x - a.x)**2 + (player.y - a.y)**2);
                if (dist < player.r + 15) {
                    score++;
                    scoreEl.innerText = score;
                    atoms.splice(i, 1);
                } else if (a.y > canvas.height) {
                    atoms.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        loop();
    </script>
</body>
</html>
