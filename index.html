<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Fundo garantido como preto */
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%; }
        
        /* Placar gigante e fixo */
        #score-container {
            position: absolute; top: 10%; width: 100%; text-align: center;
            color: #ffd700; font-family: sans-serif; pointer-events: none; z-index: 100;
        }
        #score-val { font-size: 80px; font-weight: bold; display: block; }
        .label { font-size: 14px; color: #fff; text-transform: uppercase; }

        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 200; text-align: center;
        }
    </style>
</head>
<body>

    <div id="score-container">
        <span class="label">Átomos</span>
        <div id="score-val">0</div>
    </div>

    <div id="overlay">
        <h2 id="otitle"></h2>
        <p id="otext" style="padding: 20px;"></p>
        <button onclick="resume()" style="padding: 15px 30px; font-weight: bold;">CONTINUAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-val');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let gameActive = true;
        let currentStage = -1;

        const stages = [
            { t: 0, h: "BIG BANG", p: "Tudo começou aqui!" },
            { t: 15, h: "ESTRELAS", p: "Você é poeira de estrelas." }
        ];

        const player = { x: canvas.width/2, y: canvas.height * 0.7, r: 25 };
        const objects = [];

        function resume() {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            loop();
        }

        function check() {
            const s = stages.find((st, i) => score >= st.t && i > currentStage);
            if (s) {
                currentStage = stages.indexOf(s);
                gameActive = false;
                document.getElementById('otitle').innerText = s.h;
                document.getElementById('otext').innerText = s.p;
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        // Movimento
        window.addEventListener('touchmove', (e) => {
            player.x = e.touches[0].clientX;
        });
        window.addEventListener('mousemove', (e) => player.x = e.clientX);

        function spawn() {
            if (!gameActive) return;
            objects.push({
                x: Math.random() * canvas.width,
                y: -20,
                type: Math.random() > 0.8 ? 'bad' : 'good',
                s: 5
            });
        }

        function loop() {
            if (!gameActive) return;
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();

            for (let i = objects.length - 1; i >= 0; i--) {
                let o = objects[i];
                o.y += o.s;
                ctx.beginPath();
                ctx.arc(o.x, o.y, 15, 0, Math.PI*2);
                ctx.fillStyle = o.type === 'bad' ? 'red' : 'gold';
                ctx.fill();

                if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + 15) {
                    if (o.type === 'good') {
                        score++;
                        scoreEl.innerText = score;
                        check();
                    } else {
                        score = Math.max(0, score - 1);
                        scoreEl.innerText = score;
                    }
                    objects.splice(i, 1);
                } else if (o.y > canvas.height) objects.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        check();
        loop();
    </script>
</body>
</html>
