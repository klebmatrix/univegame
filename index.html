<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        
        /* BOTÃO COM MARGEM DE SEGURANÇA */
        #home-link {
            position: fixed; 
            top: 40px; /* Empurrei para baixo para fugir da câmera/barra */
            left: 20px; /* Afastei da borda lateral */
            z-index: 9999;
            background: #ff4757; /* Vermelho mais visível */
            color: #fff; 
            padding: 12px 20px; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: bold;
            border-radius: 8px;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* PLACAR AINDA MAIS BAIXO */
        #score {
            position: absolute; 
            top: 120px; /* Desci o placar para não bater no botão */
            width: 100%; 
            text-align: center;
            font-size: 80px; 
            color: #ffd700; 
            font-weight: bold; 
            pointer-events: none;
            text-shadow: 2px 2px 10px #000;
        }
        canvas { display: block; background: #000; }
    </style>
</head>
<body>

    <a href="https://cromosvirtual.com/" id="home-link" target="_top">← VOLTAR</a>
    <div id="score">0</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height * 0.65; // Ajuste fino da bola
        }

        let score = 0;
        let player = { x: window.innerWidth/2, y: window.innerHeight * 0.65, r: 30 };
        let dots = [];

        window.addEventListener('resize', resize);
        resize();

        function move(e) {
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = x;
        }
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); }, {passive: false});

        function spawn() {
            dots.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                s: 5 + (score / 20)
            });
        }

        function loop() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Jogador (Bola Branca)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();

            for (let i = dots.length - 1; i >= 0; i--) {
                let d = dots[i];
                d.y += d.s;

                ctx.beginPath();
                ctx.arc(d.x, d.y, 15, 0, Math.PI*2);
                ctx.fillStyle = "#ffd700";
                ctx.fill();

                let dist = Math.hypot(player.x - d.x, player.y - d.y);
                if (dist < player.r + 15) {
                    score++;
                    scoreEl.innerText = score;
                    dots.splice(i, 1);
                } else if (d.y > canvas.height) {
                    dots.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        loop();
    </script>
</body>
</html>
