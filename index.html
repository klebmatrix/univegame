<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const energyFill = document.getElementById('energy-fill');
        
        // Ajuste dinâmico para mobile
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let energy = 100;
        let gameActive = true;
        let currentStage = -1;

        const stages = [
            { threshold: 0, title: "Big Bang", text: "Início de tudo. Energia pura se transformando em matéria." },
            { threshold: 25, title: "Reionização", text: "As primeiras estrelas limpam a névoa cósmica com luz." },
            { threshold: 50, title: "Presente", text: "Bilhões de anos depois, os átomos formam a vida. Você chegou!" }
        ];

        // Jogador um pouco mais alto para não ficar embaixo do dedo
        const player = { x: canvas.width/2, y: canvas.height * 0.85, radius: 15 };
        const objects = [];

        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = canvas.getBoundingClientRect();
            player.x = clientX - rect.left;
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            handleMove(e); 
        }, { passive: false });

        function showPedagogy() {
            const stage = stages.find((s, idx) => score >= s.threshold && idx > currentStage);
            if (stage) {
                currentStage = stages.indexOf(stage);
                gameActive = false;
                document.getElementById('info-title').innerText = stage.title;
                document.getElementById('info-text').innerText = stage.text;
                document.getElementById('info-overlay').style.display = 'flex';
            }
        }

        function resume() {
            document.getElementById('info-overlay').style.display = 'none';
            gameActive = true;
            loop();
        }

        function spawn() {
            if (!gameActive) return;
            const isEnemy = Math.random() > 0.75;
            objects.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -50, // Começa bem acima para dar tempo de ver cair
                type: isEnemy ? 'dark' : 'atom',
                speed: 3 + (score / 50)
            });
        }

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Efeito de rastro (opcional para beleza visual)
            ctx.fillStyle = "rgba(255,255,255,0.1)";
            for(let i=0; i<3; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

            // Jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 20; ctx.shadowColor = "#00d4ff";
            ctx.fill();

            for (let i = objects.length - 1; i >= 0; i--) {
                const o = objects[i];
                o.y += o.speed;
                
                ctx.beginPath();
                ctx.arc(o.x, o.y, 12, 0, Math.PI*2);
                ctx.fillStyle = o.type === 'dark' ? '#ff2a6d' : '#ffd700';
                ctx.fill();

                if (Math.hypot(player.x - o.x, player.y - o.y) < player.radius + 12) {
                    if (o.type === 'atom') {
                        score++;
                        energy = Math.min(100, energy + 2);
                        document.getElementById('score-val').innerText = score;
                        showPedagogy();
                    } else {
                        energy -= 10;
                        if (energy <= 0) {
                            alert("O Universo esfriou... tente novamente!");
                            location.reload();
                        }
                    }
                    energyFill.style.width = energy + "%";
                    objects.splice(i, 1);
                } else if (o.y > canvas.height + 50) {
                    objects.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        showPedagogy();
        loop();
    </script>
