<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #home-link {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            color: #fff; background: #333; padding: 10px; text-decoration: none; font-size: 12px;
        }
        #score {
            position: absolute; top: 50px; width: 100%; text-align: center;
            font-size: 70px; color: #ffd700; font-weight: bold; pointer-events: none;
        }
        canvas { display: block; }
    </style>
</head>
<body>

    <a href="https://cromosvirtual.com/" id="home-link" target="_top">VOLTAR HOME</a>
    <div id="score">0</div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        // POSIÇÃO DA BOLA: 50% da altura (bem no meio para não sumir)
        let player = { x: canvas.width/2, y: canvas.height * 0.5, r: 25 };
        let dots = [];

        function move(e) {
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = x;
        }
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); }, {passive: false});

        function spawn() {
            dots.push({
                x: Math.random() * canvas.width,
                y: -20,
                s: 5 + (score / 10)
            });
        }

        function loop() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenha o jogador (Bola Branca)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();

            for (let i = dots.length - 1; i >= 0; i--) {
                let d = dots[i];
                d.y += d.s;

                ctx.beginPath();
                ctx.arc(d.x, d.y, 15, 0, Math.PI*2);
                ctx.fillStyle = "gold";
                ctx.fill();

                // Colisão
                let dist = Math.hypot(player.x - d.x, player.y - d.y);
                if (dist < player.r + 15) {
                    score++;
                    scoreEl.innerText = score;
                    dots.splice(i, 1);
                } else if (d.y > canvas.height) {
                    dots.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        loop();
    </script>
</body>
</html>
