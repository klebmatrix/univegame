<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        
        /* BOTÃO PURO HTML - NÃO TRAVA O JOGO */
        #home-link {
            position: fixed; 
            top: 60px; 
            left: 20px; 
            z-index: 1000;
            background: #ff4757; 
            color: #fff !important; 
            padding: 15px 25px; 
            text-decoration: none !important;
            font-size: 16px; 
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #fff;
            display: block;
            text-align: center;
        }

        #score {
            position: absolute; top: 140px; width: 100%; text-align: center;
            font-size: 80px; color: #ffd700; font-weight: bold; pointer-events: none;
        }
        canvas { display: block; background: #000; }
    </style>
</head>
<body>

    <a href="https://cromosvirtual.com/" id="home-link" target="_top">VOLTAR PARA HOME</a>
    
    <div id="score">0</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height * 0.7; 
        }

        let score = 0;
        let player = { x: window.innerWidth/2, y: window.innerHeight * 0.7, r: 35 };
        let dots = [];

        window.addEventListener('resize', resize);
        resize();

        function move(e) {
            let x = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = x;
        }

        window.addEventListener('touchmove', (e) => { 
            // Se o toque for no link, não bloqueia o evento padrão (deixa o link funcionar)
            if(e.target.id !== 'home-link') {
                e.preventDefault(); 
                move(e);
            }
        }, {passive: false});

        window.addEventListener('mousemove', move);

        function spawn() {
            dots.push({
                x: Math.random() * (canvas.width - 50) + 25,
                y: -50,
                s: 5
            });
        }

        function loop() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.fill();

            // Átomos
            for (let i = dots.length - 1; i >= 0; i--) {
                let d = dots[i];
                d.y += d.s;
                ctx.beginPath();
                ctx.arc(d.x, d.y, 20, 0, Math.PI*2);
                ctx.fillStyle = "#ffd700";
                ctx.fill();

                if (Math.hypot(player.x - d.x, player.y - d.y) < player.r + 20) {
                    score++;
                    scoreEl.innerText = score;
                    dots.splice(i, 1);
                } else if (d.y > canvas.height + 50) dots.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        loop();
    </script>
</body>
</html>
