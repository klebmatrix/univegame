<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: radial-gradient(circle, #050515 0%, #000 100%); }
        .hud { position: absolute; top: 10px; left: 10px; width: calc(100% - 20px); pointer-events: none; z-index: 5; }
        .energy-bar { width: 150px; height: 10px; background: #333; border: 1px solid #fff; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        #energy-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.3s; }
        #info-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 10;
        }
        .btn { padding: 12px 25px; background: #00d4ff; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="hud">
        <div id="era-label" style="color: #00d4ff; font-size: 14px;">Universo Primitivo</div>
        <div style="font-size: 18px;">Átomos: <span id="score-val">0</span></div>
        <div class="energy-bar"><div id="energy-fill"></div></div>
    </div>

    <div id="info-overlay">
        <h2 id="info-title"></h2>
        <p id="info-text" style="max-width: 400px; line-height: 1.5;"></p>
        <button class="btn" onclick="resume()">Continuar Evolução</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const energyFill = document.getElementById('energy-fill');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let energy = 100;
        let gameActive = true;
        let currentStage = -1;

        const stages = [
            { threshold: 0, title: "Universo Primitivo", text: "Tudo começou com energia pura e radiação de fundo. Colete luz!", label: "Início (13.8 bi anos)" },
            { threshold: 15, title: "Era das Trevas", text: "O universo esfriou e ficou escuro até que as primeiras estrelas surgissem.", label: "Era das Trevas" },
            { threshold: 35, title: "Cosmic Noon", text: "O pico da formação estelar! Aqui nasceram os átomos que formam você.", label: "Meio-dia Cósmico" }
        ];

        const player = { x: canvas.width/2, y: canvas.height - 80, radius: 15 };
        const objects = [];

        // Lógica de Movimento Híbrida (Mouse e Touch)
        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX;
            // Garante que o jogador não saia da tela
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });

        function showPedagogy() {
            const stage = stages.find((s, idx) => score >= s.threshold && idx > currentStage);
            if (stage) {
                currentStage = stages.indexOf(stage);
                gameActive = false;
                document.getElementById('info-title').innerText = stage.title;
                document.getElementById('info-text').innerText = stage.text;
                document.getElementById('era-label').innerText = stage.label;
                document.getElementById('info-overlay').style.display = 'flex';
            }
        }

        function resume() {
            document.getElementById('info-overlay').style.display = 'none';
            gameActive = true;
            loop();
        }

        function spawn() {
            if (!gameActive) return;
            const isEnemy = Math.random() > 0.7;
            objects.push({
                x: Math.random() * canvas.width,
                y: -20,
                type: isEnemy ? 'dark' : 'atom',
                speed: 3 + (score / 20)
            });
        }

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Jogador (Luz)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 15; ctx.shadowColor = "#00d4ff";
            ctx.fill();

            for (let i = objects.length - 1; i >= 0; i--) {
                const o = objects[i];
                o.y += o.speed;
                
                ctx.beginPath();
                ctx.arc(o.x, o.y, 10, 0, Math.PI*2);
                ctx.fillStyle = o.type === 'dark' ? '#ff3366' : '#ffd700';
                ctx.fill();

                const dist = Math.hypot(player.x - o.x, player.y - o.y);
                if (dist < player.radius + 10) {
                    if (o.type === 'atom') {
                        score++;
                        energy = Math.min(100, energy + 2);
                        document.getElementById('score-val').innerText = score;
                        showPedagogy();
                    } else {
                        energy -= 15;
                        if (energy <= 0) {
                            alert("Energia esgotada! O ciclo recomeça.");
                            location.reload();
                        }
                    }
                    energyFill.style.width = energy + "%";
                    objects.splice(i, 1);
                }
                if (o.y > canvas.height) objects.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        showPedagogy();
        loop();
    </script>
</body>
</html>
