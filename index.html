<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: radial-gradient(circle, #0a0a25 0%, #000 100%); }
        
        .hud { 
            position: absolute; top: 10px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 5;
        }
        .score-val { font-size: 32px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .energy-bar { width: 70px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; margin-top: 5px; }
        #energy-fill { width: 100%; height: 100%; background: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

        #info-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 30px; z-index: 10;
        }
        #info-box { border-left: 3px solid #00d4ff; padding-left: 15px; max-width: 260px; text-align: left; }
        h2 { font-size: 18px; color: #00d4ff; margin: 0; text-transform: uppercase; }
        p { font-size: 15px; margin: 10px 0; line-height: 1.4; color: #eee; }
        .btn { background: #00d4ff; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="score-val" id="score-display">0</div>
        <div style="text-align: right;">
            <div style="font-size: 10px; opacity: 0.8;">ENERGIA</div>
            <div class="energy-bar"><div id="energy-fill"></div></div>
        </div>
    </div>

    <div id="info-overlay">
        <div id="info-box">
            <h2 id="info-title"></h2>
            <p id="info-text"></p>
            <button class="btn" onclick="resume()">AVANÇAR</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const energyFill = document.getElementById('energy-fill');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let energy = 100;
        let gameActive = true;
        let currentStage = -1;

        const stages = [
            { threshold: 0, title: "O Início", text: "Energia pura se condensa. Comece a coletar matéria para formar o Universo." },
            { threshold: 20, title: "Primeiras Estrelas", text: "O gás se aglutina. As estrelas forjam elementos pesados como o Carbono." },
            { threshold: 45, title: "O Humano", text: "Bilhões de anos de evolução. Você é poeira de estrelas consciente. Parabéns!" }
        ];

        const player = { x: canvas.width/2, y: canvas.height * 0.82, radius: 18 };
        const objects = [];

        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = canvas.getBoundingClientRect();
            player.x = clientX - rect.left;
            // Limites da tela
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });

        function showPedagogy() {
            const stage = stages.find((s, idx) => score >= s.threshold && idx > currentStage);
            if (stage) {
                currentStage = stages.indexOf(stage);
                gameActive = false;
                document.getElementById('info-title').innerText = stage.title;
                document.getElementById('info-text').innerText = stage.text;
                document.getElementById('info-overlay').style.display = 'flex';
            }
        }

        function resume() {
            document.getElementById('info-overlay').style.display = 'none';
            gameActive = true;
            loop();
        }

        function spawn() {
            if (!gameActive) return;
            const isEnemy = Math.random() > 0.78;
            objects.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                type: isEnemy ? 'dark' : 'atom',
                speed: 3.5 + (score / 40)
            });
        }

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Jogador (Ponto de Consciência)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 25; ctx.shadowColor = "#00d4ff";
            ctx.fill();

            for (let i = objects.length - 1; i >= 0; i--) {
                const o = objects[i];
                o.y += o.speed;
                
                ctx.beginPath();
                ctx.arc(o.x, o.y, 14, 0, Math.PI*2);
                ctx.fillStyle = o.type === 'dark' ? '#ff2a6d' : '#ffd700';
                ctx.shadowBlur = o.type === 'dark' ? 0 : 15;
                ctx.fill();

                if (Math.hypot(player.x - o.x, player.y - o.y) < player.radius + 14) {
                    if (o.type === 'atom') {
                        score++;
                        energy = Math.min(100, energy + 2);
                        document.getElementById('score-display').innerText = score;
                        showPedagogy();
                    } else {
                        energy -= 10;
                        if (energy <= 0) location.reload();
                    }
                    energyFill.style.width = energy + "%";
                    objects.splice(i, 1);
                } else if (o.y > canvas.height + 50) {
                    objects.splice(i, 1);
                }
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 550);
        showPedagogy();
        loop();
    </script>
</body>
</html>
