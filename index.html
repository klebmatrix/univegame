<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; width: 100%; font-family: sans-serif; }
        
        /* BOTÃO HOME */
        #home-btn {
            position: absolute; top: 10px; left: 10px; z-index: 300;
            background: rgba(255, 255, 255, 0.2); color: #fff;
            text-decoration: none; padding: 8px 12px; border-radius: 5px;
            font-size: 10px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3);
            text-transform: uppercase;
        }

        #score-container {
            position: absolute; top: 5%; width: 100%; text-align: center;
            color: #ffd700; pointer-events: none; z-index: 100;
        }
        #score-val { font-size: 70px; font-weight: bold; display: block; line-height: 1; }
        .label { font-size: 12px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }

        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 200; text-align: center;
        }
        .btn-game { padding: 12px 25px; background: #00d4ff; border: none; font-weight: bold; border-radius: 5px; color: #000; cursor: pointer; }
    </style>
</head>
<body>

    <a href="https://cromosvirtual.com/" id="home-btn">← VOLTAR PARA HOME</a>

    <div id="score-container">
        <span class="label">Átomos Coletados</span>
        <div id="score-val">0</div>
    </div>

    <div id="overlay">
        <h2 id="otitle" style="color: #00d4ff;"></h2>
        <p id="otext" style="padding: 20px; max-width: 300px; line-height: 1.5;"></p>
        <button class="btn-game" onclick="resume()">CONTINUAR EVOLUÇÃO</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score-val');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height * 0.75;
        }

        let score = 0;
        let gameActive = true;
        let currentStage = -1;

        const stages = [
            { t: 0, h: "O BIG BANG", p: "Há 13,8 bilhões de anos, o Universo nasceu em uma grande expansão de energia." },
            { t: 15, h: "FORMANDO ESTRELAS", p: "As primeiras estrelas surgiram, criando o Carbono e Oxigênio que formam seu corpo." },
            { t: 40, h: "A VIDA SURGE", p: "O Cosmos se tornou consciente através de você. Somos todos poeira de estrelas!" }
        ];

        const player = { x: window.innerWidth/2, y: window.innerHeight * 0.75, r: 25 };
        const objects = [];

        window.addEventListener('resize', resize);
        resize();

        function resume() {
            document.getElementById('overlay').style.display = 'none';
            gameActive = true;
            loop();
        }

        function check() {
            const s = stages.find((st, i) => score >= st.t && i > currentStage);
            if (s) {
                currentStage = stages.indexOf(s);
                gameActive = false;
                document.getElementById('otitle').innerText = s.h;
                document.getElementById('otext').innerText = s.p;
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX;
        };

        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
        window.addEventListener('mousemove', handleMove);

        function spawn() {
            if (!gameActive) return;
            objects.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                type: Math.random() > 0.8 ? 'bad' : 'good',
                s: 4 + (score / 40)
            });
        }

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Jogador (Bola Branca Brilhante)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = "white";
            ctx.shadowBlur = 20; ctx.shadowColor = "#00d4ff";
            ctx.fill();

            for (let i = objects.length - 1; i >= 0; i--) {
                let o = objects[i];
                o.y += o.s;
                
                ctx.beginPath();
                ctx.arc(o.x, o.y, 15, 0, Math.PI*2);
                ctx.fillStyle = o.type === 'bad' ? '#ff3366' : '#ffd700';
                ctx.shadowBlur = o.type === 'bad' ? 0 : 10;
                ctx.fill();

                if (Math.hypot(player.x - o.x, player.y - o.y) < player.r + 15) {
                    if (o.type === 'good') {
                        score++;
                        scoreEl.innerText = score;
                        check();
                    } else {
                        score = Math.max(0, score - 5);
                        scoreEl.innerText = score;
                    }
                    objects.splice(i, 1);
                } else if (o.y > canvas.height + 50) objects.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 600);
        check();
        loop();
    </script>
</body>
</html>
