<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: radial-gradient(circle, #08081a 0%, #000 100%); }
        
        /* HUD Ultra Minimalista */
        .hud { 
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 5;
        }
        .score-box { font-size: 28px; font-weight: bold; color: #ffd700; line-height: 1; }
        .energy-bar { width: 80px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
        #energy-fill { width: 100%; height: 100%; background: #00ffcc; }

        /* Pop-up de história rápido */
        #info-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 10;
        }
        #info-box { border-left: 4px solid #00d4ff; padding-left: 15px; max-width: 250px; text-align: left; }
        h2 { font-size: 16px; text-transform: uppercase; color: #00d4ff; margin: 0; }
        p { font-size: 14px; margin: 5px 0; line-height: 1.3; color: #ccc; }
        .btn { background: #fff; color: #000; border: none; padding: 8px 15px; font-weight: bold; font-size: 12px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="score-box" id="score-val">0</div>
        <div style="text-align: right;">
            <div style="font-size: 9px; opacity: 0.7;">ENERGIA</div>
            <div class="energy-bar"><div id="energy-fill"></div></div>
        </div>
    </div>

    <div id="info-overlay">
        <div id="info-box">
            <h2 id="info-title"></h2>
            <p id="info-text"></p>
            <button class="btn" onclick="resume()">OK</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const energyFill = document.getElementById('energy-fill');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let energy = 100;
        let gameActive = true;
        let currentStage = -1;

        const stages = [
            { threshold: 0, title: "Big Bang", text: "Início de tudo. Energia pura se transformando em matéria." },
            { threshold: 25, title: "Reionização", text: "As primeiras estrelas limpam a névoa cósmica com luz." },
            { threshold: 50, title: "Presente", text: "Bilhões de anos depois, os átomos formam a vida. Você chegou!" }
        ];

        const player = { x: canvas.width/2, y: canvas.height - 70, radius: 14 };
        const objects = [];

        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX;
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        };

        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });

        function showPedagogy() {
            const stage = stages.find((s, idx) => score >= s.threshold && idx > currentStage);
            if (stage) {
                currentStage = stages.indexOf(stage);
                gameActive = false;
                document.getElementById('info-title').innerText = stage.title;
                document.getElementById('info-text').innerText = stage.text;
                document.getElementById('info-overlay').style.display = 'flex';
            }
        }

        function resume() {
            document.getElementById('info-overlay').style.display = 'none';
            gameActive = true;
            loop();
        }

        function spawn() {
            if (!gameActive) return;
            const isEnemy = Math.random() > 0.75;
            objects.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                type: isEnemy ? 'dark' : 'atom',
                speed: 4 + (score / 40)
            });
        }

        function loop() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Jogador (Estrela guia)
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 20; ctx.shadowColor = "#00d4ff";
            ctx.fill();

            for (let i = objects.length - 1; i >= 0; i--) {
                const o = objects[i];
                o.y += o.speed;
                
                ctx.beginPath();
                ctx.arc(o.x, o.y, 10, 0, Math.PI*2);
                ctx.fillStyle = o.type === 'dark' ? '#ff2a6d' : '#ffd700';
                ctx.shadowBlur = o.type === 'dark' ? 0 : 10;
                ctx.fill();

                if (Math.hypot(player.x - o.x, player.y - o.y) < player.radius + 10) {
                    if (o.type === 'atom') {
                        score++;
                        energy = Math.min(100, energy + 1);
                        document.getElementById('score-val').innerText = score;
                        showPedagogy();
                    } else {
                        energy -= 10;
                        if (energy <= 0) location.reload();
                    }
                    energyFill.style.width = energy + "%";
                    objects.splice(i, 1);
                } else if (o.y > canvas.height) objects.splice(i, 1);
            }
            requestAnimationFrame(loop);
        }

        setInterval(spawn, 500);
        showPedagogy();
        loop();
    </script>
</body>
</html>
